<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ลองดูก่อน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Mitr:wght@500;600&display=swap">
<style>
/* Layout: one phone-sized chat card on a green / yellow / red striped backdrop. Neon badge + crab on top, conversation thread in the middle, choices stacked at the bottom. Edit drawer slides in from the side (bottom sheet on phones). */
:root {
  --bg: #ffe97a;
  --stripe-g: #a9dc8a;
  --stripe-y: #ffe97a;
  --stripe-r: #f48a7b;
  --card: #fff9e8;
  --glow: #ffe9a8;
  --ink: #3a2019;
  --crab: #ff8a3d;
  --crab-dark: #e0661f;
  --leaf: #7fcf6e;
  --cheek: #ff7d8c;
  --tear: #cdeaff;
  --mouth: #d6334a;
  --neon: #e5392e;
  --question: #8a2a14;
  --me: #a8dc7e;
  --me-ink: #1d3a12;
  --panel: #fffaf0;
  --panel-ink: #3a2019;
  --panel-line: #efd9a6;
  --font-body: "Mali", "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  --font-neon: "Mitr", "Kanit", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: repeating-linear-gradient(135deg, var(--stripe-g) 0 60px, var(--stripe-y) 60px 120px, var(--stripe-r) 120px 180px);
  color: var(--question);
  font-family: var(--font-body);
  font-size: 16px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app {
  width: min(100%, 460px);
  height: min(calc(100vh - 40px), 780px);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 26px;
  padding: 14px;
  box-shadow: 6px 6px 0 var(--ink);
}
.top { position: relative; display: grid; place-items: center; flex: none; padding-top: 6px; }
.badge {
  position: absolute;
  top: 0;
  left: 0;
  max-width: 55%;
  font-family: var(--font-neon);
  font-weight: 600;
  font-size: 1.7rem;
  line-height: 1.15;
  transform: rotate(-4deg);
  color: #fff3b0;
  -webkit-text-stroke: 1px var(--neon);
  text-shadow: 0 0 6px #ff3b30, 0 0 14px #ffb300, 0 0 28px #ff3b30;
  overflow-wrap: anywhere;
}
.mascot-wrap { position: relative; width: 150px; aspect-ratio: 240 / 200; max-width: 100%; display: grid; place-items: center; transition: width .7s cubic-bezier(.2, 1.4, .4, 1); }
.app.big { justify-content: center; gap: 18px; }
.app.big .top { padding-top: 0; }
.app.big .mascot-wrap { width: min(72vw, 300px); }
.finale {
  margin: 0;
  text-align: center;
  font-size: clamp(1.9rem, 9vw, 3rem);
  line-height: 1.35;
  font-weight: 700;
  color: var(--question);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  padding-inline: 4px;
  animation: pop .5s .15s ease-out both;
}
.flower { display: none; transform-box: fill-box; transform-origin: 50% 100%; }
#mascot[data-flower="1"] .flower { display: inline; animation: bloom .7s .35s ease-out both; }
.mascot-wrap::before { content: ""; position: absolute; inset: 6% 4%; background: radial-gradient(closest-side, var(--glow), transparent); border-radius: 50%; }
#mascot { position: relative; z-index: 1; width: 100%; height: 100%; overflow: visible; animation: idle 3s ease-in-out infinite; transform-origin: 50% 90%; }
#mascot * { stroke-linecap: round; stroke-linejoin: round; }
.line { fill: none; stroke: var(--ink); stroke-width: 4; }
.fillink { fill: var(--ink); }
.m { display: none; }
#mascot[data-mood="happy"] .m-happy,
#mascot[data-mood="wonder"] .m-wonder,
#mascot[data-mood="sad"] .m-sad,
#mascot[data-mood="cry"] .m-cry,
#mascot[data-mood="sob"] .m-sob,
#mascot[data-mood="love"] .m-love { display: inline; }
#mascot[data-mood="sob"] { animation: shake .22s linear infinite; }
#mascot[data-mood="love"] { animation: bounce .9s ease-in-out infinite; }
.claw { transition: transform .4s ease; }
.claw-l { transform-origin: 42px 108px; }
.claw-r { transform-origin: 158px 108px; }
#mascot[data-mood="sad"] .claw-l, #mascot[data-mood="cry"] .claw-l, #mascot[data-mood="sob"] .claw-l { transform: rotate(-45deg); }
#mascot[data-mood="sad"] .claw-r, #mascot[data-mood="cry"] .claw-r, #mascot[data-mood="sob"] .claw-r { transform: rotate(45deg); }
#mascot[data-mood="love"] .claw-l { animation: snipl .5s ease-in-out infinite alternate; }
#mascot[data-mood="love"] .claw-r { animation: snipr .5s ease-in-out infinite alternate; }
.tear { fill: var(--tear); stroke: var(--ink); stroke-width: 2; animation: tear 1.1s ease-in infinite; transform-box: fill-box; transform-origin: 50% 0; }
.tear.b { animation-delay: .35s; }

.thread {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 8px 2px;
  scroll-behavior: smooth;
}
.msg {
  max-width: 84%;
  padding: 9px 14px;
  border: 2px solid var(--ink);
  border-radius: 18px;
  line-height: 1.5;
  font-weight: 600;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg.char { align-self: flex-start; background: #fff; color: var(--question); border-bottom-left-radius: 5px; }
.msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 5px; }
.msg.fresh { animation: pop .25s ease-out; }
.dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--question); opacity: .35; animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
.choices { flex: none; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.choice, .restart {
  font: inherit;
  font-weight: 700;
  text-align: left;
  color: var(--question);
  background: var(--glow);
  border: 2px solid var(--question);
  border-radius: 14px;
  padding: .65em 1em;
  cursor: pointer;
  overflow-wrap: anywhere;
  transition: transform .1s ease, background .15s ease;
}
.restart { text-align: center; border-radius: 999px; }
.choice:hover, .restart:hover { background: #fff; }
.choice:active, .restart:active { transform: scale(.98); }
.choice:disabled { opacity: .45; cursor: default; }
.choice:focus-visible, .restart:focus-visible, .tool:focus-visible, .field:focus-visible, .pbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.heart { position: absolute; z-index: 2; bottom: 30%; width: 22px; height: 22px; pointer-events: none; animation: rise 2.2s ease-out forwards; }
.heart path { fill: var(--neon); stroke: var(--ink); stroke-width: 1.5; }

/* editing */
.tool {
  position: fixed; z-index: 20;
  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-body); font-weight: 700;
  background: var(--panel); color: var(--panel-ink);
  border: 2px solid var(--ink); border-radius: 999px;
  padding: .6em 1.2em; cursor: pointer;
  box-shadow: 0 6px 18px rgba(42,47,85,.25);
}
.app.has-tool .choices { padding-bottom: 54px; }
.panel {
  position: fixed; z-index: 30; right: 0; bottom: 0; top: 0;
  width: min(100%, 420px);
  background: var(--panel); color: var(--panel-ink);
  border-left: 2px solid var(--ink);
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: -10px 0 30px rgba(42,47,85,.2);
}
.panel h2 { margin: 0; font-size: 1.15rem; font-family: var(--font-neon); font-weight: 600; }
.panel h3 { margin: 0; font-size: .95rem; }
.panel p.hint { margin: 0; font-size: .82rem; line-height: 1.5; opacity: .8; }
.panel label { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 700; }
.field { font: inherit; font-weight: 400; color: var(--panel-ink); background: #fff; border: 2px solid var(--panel-line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; resize: vertical; }
.card { display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--panel-line); border-radius: 14px; padding: 12px; background: #fff; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
.crow .sub { grid-column: 1 / -1; }
.choicebox { display: flex; flex-direction: column; gap: 8px; border-left: 3px solid var(--neon); padding-left: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { font: inherit; font-weight: 700; font-size: .85rem; border: 2px solid var(--ink); border-radius: 10px; padding: 7px 12px; cursor: pointer; background: #fff; color: var(--panel-ink); }
.pbtn.primary { background: var(--neon); color: #fff; }
.pbtn.small { padding: 4px 9px; font-size: .8rem; }
.pbtn:disabled { opacity: .4; cursor: default; }
.status { min-height: 1.4em; margin: 0; font-size: .85rem; line-height: 1.4; }
.sticky { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--panel); padding-block: 10px; margin-block: 0 -10px; border-top: 2px solid var(--panel-line); }
@media (max-width: 560px) {
  .panel { top: auto; width: 100%; max-height: 82vh; border-left: 0; border-top: 2px solid var(--ink); border-radius: 18px 18px 0 0; }
  .badge { font-size: 1.45rem; }
}
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes shake { 0%,100% { transform: translate(0,0) rotate(0) } 25% { transform: translate(-3px,1px) rotate(-1.5deg) } 75% { transform: translate(3px,-1px) rotate(1.5deg) } }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1,1) } 50% { transform: translateY(-12px) scale(.97,1.04) } }
@keyframes tear { 0% { transform: scaleY(.2); opacity: 0 } 20% { opacity: 1 } 100% { transform: scaleY(1) translateY(6px); opacity: .2 } }
@keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes bloom { from { transform: scale(0) rotate(-35deg); opacity: 0 } to { transform: scale(1) rotate(0); opacity: 1 } }
@keyframes snipl { to { transform: rotate(-12deg) } }
@keyframes snipr { to { transform: rotate(12deg) } }
@keyframes blink { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 1 } 100% { transform: translateY(-130px) scale(1.2); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { #mascot, .tear, .msg, .heart, .dots i, .flower, .claw { animation: none !important; } .thread { scroll-behavior: auto; } .mascot-wrap { transition: none; } }
</style>

<button class="tool" id="editBtn" type="button" hidden>แก้ไขบทสนทนา</button>

<aside class="panel" id="panel" hidden aria-label="แก้ไขบทสนทนา">
  <h2>แก้ไขบทสนทนา</h2>
  <p class="hint">แต่ละข้อคือ 1 ครั้งที่ตัวการ์ตูนพูด พร้อมตัวเลือกให้คุณตอบ เลือกได้ว่าตอบแบบไหนแล้วไปข้อไหนต่อ ข้อที่ไม่มีตัวเลือกจะเป็นตอนจบ ข้อแรกคือจุดเริ่มต้น หน้าเว็บเปลี่ยนให้เห็นทันที กด “บันทึก” เพื่อให้ทุกคนที่เปิดลิงก์เห็นฉบับใหม่</p>
  <label for="f-badge">ป้ายนีออนมุมซ้ายบน<input class="field" id="f-badge" type="text" maxlength="30"></label>
  <h3>ข้อความในบทสนทนา</h3>
  <div id="steps" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="row"><button class="pbtn" id="addStep" type="button">+ เพิ่มข้อ</button></div>
  <div class="sticky">
    <div class="row">
      <button class="pbtn primary" id="save" type="button">บันทึก</button>
      <button class="pbtn" id="restart2" type="button">ทดลองเล่นใหม่</button>
      <button class="pbtn" id="reset" type="button">คืนค่าเริ่มต้น</button>
      <button class="pbtn" id="close" type="button">ปิด</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</aside>

<script>
(function () {
  var MOODS = [["happy", "ยิ้ม"], ["wonder", "สงสัย"], ["sad", "เศร้า"], ["cry", "ร้องไห้"], ["sob", "โฮ"], ["love", "รัก"]];
  var MOOD_KEYS = MOODS.map(function (m) { return m[0]; });
  var DEFAULTS = {
    badge: "ทำฟรี",
    steps: [
      { id: "s1", say: "รักเค้ามั้ยย", mood: "happy", choices: [{ text: "รักก็ได้", next: "s6" }, { text: "ไม่รัก", next: "s2" }] },
      { id: "s2", say: "อ้าว... จริงเหรอ", mood: "wonder", choices: [{ text: "จริงสิ", next: "s3" }, { text: "ล้อเล่น รักก็ได้", next: "s6" }] },
      { id: "s3", say: "ใจเสียเลย... เค้าทำอะไรผิดหรือเปล่า", mood: "sad", choices: [{ text: "ก็ไม่รู้สิ", next: "s4" }, { text: "เปล่าหรอก ขอโทษนะ", next: "s6" }] },
      { id: "s4", say: "ฮือออ เค้าร้องไห้แล้วนะ", mood: "cry", choices: [{ text: "ไม่สนหรอก", next: "s5" }, { text: "ปลอบให้ก็ได้", next: "s6" }] },
      { id: "s5", say: "โฮออออ เค้าไปนั่งรดน้ำต้นอ่อนคนเดียวก็ได้...", mood: "sob", choices: [{ text: "ขอโทษ เมื่อกี้ล้อเล่น", next: "s6" }] },
      { id: "s6", say: "เค้าก็รักอ้วนมากๆ รักที่สุดในจักรวาลเลยย 🥺❤️", mood: "love", choices: [] }
    ]
  };
  var cfg = clone(DEFAULTS);
  var history = [];
  var busy = false;
  var heartTimer = null;
  var typingTimer = null;
  var canShowEdit = false;
  var $ = function (id) { return document.getElementById(id); };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function newId() { return "s" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
  function merge(extra) {
    var out = clone(DEFAULTS);
    if (!extra || typeof extra !== "object") return out;
    if (typeof extra.badge === "string") out.badge = extra.badge;
    if (Array.isArray(extra.steps) && extra.steps.length) {
      var steps = [];
      extra.steps.forEach(function (s) {
        if (!s || typeof s.id !== "string" || typeof s.say !== "string") return;
        steps.push({
          id: s.id,
          say: s.say,
          mood: MOOD_KEYS.indexOf(s.mood) >= 0 ? s.mood : "happy",
          effect: s.effect === "flower" ? "flower" : "",
          choices: (Array.isArray(s.choices) ? s.choices : []).filter(function (c) { return c && typeof c.text === "string"; })
            .map(function (c) { return { text: c.text, next: typeof c.next === "string" ? c.next : "" }; })
        });
      });
      if (steps.length) out.steps = steps;
    }
    return out;
  }
  function lsGet() { try { return JSON.parse(localStorage.getItem("mochi-chat-cfg") || "null"); } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem("mochi-chat-cfg", JSON.stringify(v)); return true; } catch (e) { return false; } }
  function byId(id) { for (var i = 0; i < cfg.steps.length; i++) if (cfg.steps[i].id === id) return cfg.steps[i]; return null; }

  // ---- conversation ----
  function bubble(cls, text, fresh) {
    var d = document.createElement("div");
    d.className = "msg " + cls + (fresh ? " fresh" : "");
    d.textContent = text;
    return d;
  }
  function typingBubble() {
    var d = document.createElement("div");
    d.className = "msg char fresh";
    d.setAttribute("aria-label", "กำลังพิมพ์");
    d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    return d;
  }
  function spawnHeart() {
    var h = document.createElement("div");
    h.className = "heart";
    h.style.left = (15 + Math.random() * 70) + "%";
    h.innerHTML = '<svg viewBox="-12 -12 24 24" width="22" height="22"><path d="M0 8 C-18 -4 -8 -16 0 -6 C8 -16 18 -4 0 8Z"/></svg>';
    $("wrap").appendChild(h);
    h.addEventListener("animationend", function () { h.remove(); });
    setTimeout(function () { if (h.parentNode) h.remove(); }, 2600);
  }
  function setMood(m) {
    $("mascot").setAttribute("data-mood", m);
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (m === "love" && !reduce) {
      if (!heartTimer) { spawnHeart(); heartTimer = setInterval(spawnHeart, 450); }
    } else if (heartTimer) { clearInterval(heartTimer); heartTimer = null; }
  }

  // Replays history against the current script; drops any part that no longer exists.
  function render(typing) {
    var thread = $("thread");
    thread.textContent = "";
    var cur = cfg.steps[0];
    var mood = cur.mood;
    var valid = [];
    var shownMood = cur.mood;
    var shownStep = cur;
    var showLastChar = true;
    var lastIdx = history.length - 1;
    thread.appendChild(bubble("char", cur.say, false));
    for (var i = 0; i < history.length; i++) {
      var st = byId(history[i].id);
      var ch = st && st.choices[history[i].c];
      if (!ch || st.id !== cur.id) break;
      valid.push(history[i]);
      thread.appendChild(bubble("me", ch.text, i === lastIdx && !!typing));
      var nx = byId(ch.next);
      if (!nx) { cur = null; break; }
      if (typing && i === lastIdx) { thread.appendChild(typingBubble()); showLastChar = false; }
      else thread.appendChild(bubble("char", nx.say, i === lastIdx && !!typingDone));
      cur = nx;
      if (showLastChar) { shownMood = nx.mood; shownStep = nx; }
    }
    history = valid;
    setMood(shownMood);
    var big = shownStep.effect === "flower";
    $("app").classList.toggle("big", big);
    $("mascot").setAttribute("data-flower", big ? "1" : "0");
    $("finale").hidden = !big || !!typing;
    $("finale").textContent = big ? shownStep.say : "";
    thread.hidden = big && !typing;
    renderChoices(cur, typing);
    thread.scrollTop = thread.scrollHeight;
    mood = null;
  }
  var typingDone = false;
  function renderChoices(cur, typing) {
    var box = $("choices");
    box.textContent = "";
    if (typing) return;
    if (!cur || !cur.choices.length) {
      var r = document.createElement("button");
      r.type = "button"; r.className = "restart"; r.textContent = "เริ่มคุยใหม่";
      r.addEventListener("click", restart);
      box.appendChild(r);
      return;
    }
    cur.choices.forEach(function (c, idx) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.textContent = c.text || "(ยังไม่ได้ใส่ข้อความ)";
      b.addEventListener("click", function () { pick(cur.id, idx); });
      box.appendChild(b);
    });
  }
  function pick(stepId, idx) {
    if (busy) return;
    busy = true;
    history.push({ id: stepId, c: idx });
    typingDone = false;
    render(true);
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(function () { typingDone = true; busy = false; render(false); typingDone = false; }, reduce ? 50 : 700);
  }
  function restart() { clearTimeout(typingTimer); busy = false; history = []; render(false); }

  // ---- editing ----
  function stepLabel(id) {
    for (var i = 0; i < cfg.steps.length; i++) if (cfg.steps[i].id === id) {
      var t = cfg.steps[i].say.replace(/\s+/g, " ").trim();
      return "ข้อ " + (i + 1) + (t ? ": " + (t.length > 16 ? t.slice(0, 16) + "…" : t) : "");
    }
    return "";
  }
  function say(msg) { $("status").textContent = msg; }
  function refreshOptions() {
    document.querySelectorAll("#steps option[data-step]").forEach(function (o) { o.textContent = stepLabel(o.getAttribute("data-step")); });
  }
  function changed(structural) {
    if (structural) { history = []; busy = false; clearTimeout(typingTimer); buildForm(); }
    render(false); say("");
  }
  function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function labelWrap(text, control) { var l = mk("label", null); l.appendChild(mk("span", null, text)); l.appendChild(control); return l; }

  function stepCard(s, i) {
    var card = mk("div", "card");
    var head = mk("div", "card-head");
    head.appendChild(mk("strong", null, "ข้อ " + (i + 1) + (i === 0 ? " (เริ่มต้น)" : "")));
    var del = mk("button", "pbtn small", "ลบข้อนี้"); del.type = "button"; del.disabled = cfg.steps.length <= 1;
    del.addEventListener("click", function () {
      cfg.steps = cfg.steps.filter(function (x) { return x.id !== s.id; });
      cfg.steps.forEach(function (x) { x.choices.forEach(function (c) { if (c.next === s.id) c.next = ""; }); });
      changed(true);
    });
    head.appendChild(del); card.appendChild(head);

    var ta = mk("textarea", "field"); ta.rows = 2; ta.maxLength = 300; ta.value = s.say;
    ta.addEventListener("input", function () { s.say = ta.value; refreshOptions(); history = history.slice(); render(false); say(""); });
    card.appendChild(labelWrap("ตัวการ์ตูนพูดว่า", ta));

    var sel = mk("select", "field");
    MOODS.forEach(function (m) { var o = mk("option", null, m[1]); o.value = m[0]; sel.appendChild(o); });
    sel.value = s.mood;
    sel.addEventListener("change", function () { s.mood = sel.value; render(false); say(""); });
    card.appendChild(labelWrap("สีหน้าตัวการ์ตูน", sel));

    var fl = mk("input"); fl.type = "checkbox"; fl.checked = s.effect === "flower";
    fl.addEventListener("change", function () { s.effect = fl.checked ? "flower" : ""; history = []; render(false); say("กด “ทดลองเล่นใหม่” แล้วเลือกตอบจนถึงข้อนี้เพื่อดูเอฟเฟกต์"); });
    var flw = mk("label", null); flw.style.flexDirection = "row"; flw.style.alignItems = "center"; flw.style.gap = "8px";
    flw.appendChild(fl); flw.appendChild(mk("span", null, "ตอนจบเต็มจอ: ข้อความตัวใหญ่ปิดแชท ตัวการ์ตูนขยายใหญ่และยื่นช่อดอกไม้ให้"));
    card.appendChild(flw);

    var box = mk("div", "choicebox");
    box.appendChild(mk("strong", null, s.choices.length ? "ตัวเลือกให้คุณตอบ" : "ไม่มีตัวเลือก = ตอนจบ"));
    s.choices.forEach(function (c, ci) {
      var row = mk("div", "crow");
      var inp = mk("input", "field"); inp.type = "text"; inp.maxLength = 60; inp.value = c.text;
      inp.addEventListener("input", function () { c.text = inp.value; render(false); say(""); });
      row.appendChild(labelWrap("ข้อความตอบ", inp));
      var rm = mk("button", "pbtn small", "ลบ"); rm.type = "button";
      rm.addEventListener("click", function () { s.choices.splice(ci, 1); changed(true); });
      row.appendChild(rm);
      var nx = mk("select", "field");
      var end = mk("option", null, "จบบทสนทนา (ขึ้นปุ่มเริ่มใหม่)"); end.value = ""; nx.appendChild(end);
      cfg.steps.forEach(function (t) { var o = mk("option", null, stepLabel(t.id)); o.value = t.id; o.setAttribute("data-step", t.id); nx.appendChild(o); });
      nx.value = c.next;
      nx.addEventListener("change", function () { c.next = nx.value; history = []; render(false); say(""); });
      var w = labelWrap("แล้วไปที่", nx); w.className += " sub"; row.appendChild(w);
      box.appendChild(row);
    });
    var add = mk("button", "pbtn small", "+ เพิ่มตัวเลือก"); add.type = "button"; add.style.alignSelf = "flex-start";
    add.disabled = s.choices.length >= 4;
    add.addEventListener("click", function () { s.choices.push({ text: "", next: "" }); changed(true); });
    box.appendChild(add);
    card.appendChild(box);
    return card;
  }
  function buildForm() {
    $("f-badge").value = cfg.badge;
    var list = $("steps");
    list.textContent = "";
    cfg.steps.forEach(function (s, i) { list.appendChild(stepCard(s, i)); });
  }
  $("f-badge").addEventListener("input", function () { cfg.badge = $("f-badge").value; renderBadge(); say(""); });
  function renderBadge() { $("badge").textContent = cfg.badge; $("badge").hidden = !cfg.badge; }
  $("addStep").addEventListener("click", function () {
    cfg.steps.push({ id: newId(), say: "", mood: "happy", effect: "", choices: [] });
    buildForm(); say("เพิ่มข้อใหม่ไว้ท้ายสุดแล้ว ตั้งให้ตัวเลือกของข้อก่อนหน้าชี้มาที่ข้อนี้");
    var cards = $("steps").children; cards[cards.length - 1].scrollIntoView({ block: "nearest" });
  });
  $("restart2").addEventListener("click", function () { restart(); say("เริ่มบทสนทนาใหม่แล้ว"); });
  $("editBtn").addEventListener("click", function () {
    buildForm(); $("panel").hidden = false; $("editBtn").hidden = true; say("");
  });
  $("close").addEventListener("click", function () { $("panel").hidden = true; $("editBtn").hidden = !canShowEdit; });
  $("reset").addEventListener("click", function () {
    cfg = clone(DEFAULTS); history = []; buildForm(); renderBadge(); render(false); say("คืนค่าเริ่มต้นแล้ว กด “บันทึก” เพื่อใช้ค่านี้");
  });
  $("save").addEventListener("click", async function () {
    var btn = $("save"); btn.disabled = true; say("กำลังบันทึก...");
    try {
      var a = window.claude && await window.claude.use("artifact");
      if (!a) throw { code: "not_granted" };
      await a.publish({ "config.json": JSON.stringify(cfg, null, 2) });
      lsSet(cfg);
      say("บันทึกแล้ว ใครเปิดลิงก์นี้จะเห็นบทสนทนาใหม่");
    } catch (e) {
      var saved = lsSet(cfg);
      if (e && e.code === "conflict") say("มีการแก้ไขจากที่อื่นก่อนหน้า หน้าเว็บกำลังโหลดเวอร์ชันล่าสุด ลองแก้อีกครั้ง");
      else say("บันทึกลงลิงก์ไม่ได้ในมุมมองนี้" + (saved ? " จึงเก็บไว้ในเบราว์เซอร์นี้เท่านั้น" : "") + " ถ้าต้องการให้คนอื่นเห็น ให้บอกผมบทสนทนาที่ต้องการ");
    }
    btn.disabled = false;
  });
  async function setupEditor() {
    var c = window.claude;
    if (!c) canShowEdit = location.hash === "#edit";
    else { try { var u = await c.use("user"); canShowEdit = u ? await u.canEdit() : false; } catch (e) { canShowEdit = false; } }
    $("editBtn").hidden = !canShowEdit || !$("panel").hidden;
    $("app").classList.toggle("has-tool", canShowEdit);
  }

  // Keep the newest message in view while the mascot grows or shrinks and resizes the thread.
  if (window.ResizeObserver) new ResizeObserver(function () { var t = $("thread"); t.scrollTop = t.scrollHeight; }).observe($("thread"));

  // ---- boot ----
  var local = lsGet();
  if (local) cfg = merge(local);
  renderBadge(); render(false);
  cfg = merge({
  "badge": "ปูปู๋ปู๊",
  "steps": [
    {
      "id": "s1",
      "say": "มานั่งเล่นอันนี้แป๊ปสิ",
      "mood": "happy",
      "effect": "",
      "choices": [
        {
          "text": "มันคืออะไร",
          "next": "smwornhk5266"
        },
        {
          "text": "ไม่เล่นเสียเวลา",
          "next": "s2"
        }
      ]
    },
    {
      "id": "s2",
      "say": "อ้าว...T-Tแค่แป๊ปๆเองNa",
      "mood": "cry",
      "effect": "",
      "choices": [
        {
          "text": "อะมันมีอะไร",
          "next": "s3"
        }
      ]
    },
    {
      "id": "s3",
      "say": "มีอะไรจะบอกแต่มีข้อแม้",
      "mood": "sad",
      "effect": "",
      "choices": [
        {
          "text": "ว่ายังไง",
          "next": "s4"
        }
      ]
    },
    {
      "id": "s4",
      "say": "โมโม ต้องมองหน้าตอนพูดก่อน",
      "mood": "sob",
      "effect": "",
      "choices": [
        {
          "text": "แล้วยังไงต่อ",
          "next": "s5"
        }
      ]
    },
    {
      "id": "s5",
      "say": "รซต ต้องไม่ติดตลก",
      "mood": "happy",
      "effect": "",
      "choices": [
        {
          "text": "อะแล้วว่าอะไร",
          "next": "s6"
        }
      ]
    },
    {
      "id": "s6",
      "say": "และบราวนี่ต้องเลิกงอแง",
      "mood": "happy",
      "effect": "",
      "choices": [
        {
          "text": "Ok",
          "next": "smworluavrs"
        }
      ]
    },
    {
      "id": "smworluavrs",
      "say": "Pom ma kor toht krap D gun Dgun",
      "mood": "love",
      "effect": "flower",
      "choices": []
    },
    {
      "id": "smwornhk5266",
      "say": "เถอะน่าแป๊ปเดียวทำตั้งนาน",
      "mood": "sob",
      "effect": "",
      "choices": [
        {
          "text": "อ่ะไหน",
          "next": "s3"
        }
      ]
    }
  ]
});
  history = []; renderBadge(); render(false);
  setupEditor();
})();
</script>

</body></html>
